<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe3df">
<title>DIETDIEDIE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --sky:#bfe3df; --sky2:#dff0e8; --grass:#b8d891; --grass2:#dcebc8;
  --cream:#fff9e9; --paper:#fffdf5; --ink:#3e3b3b; --muted:#817a72;
  --green:#79a66b; --green-dark:#5f8454; --yellow:#f3cf73; --peach:#efaa91;
  --blue:#8ebed0; --brown:#927256; --line:#d8ccb7; --shadow:#b7a183;
}
*{box-sizing:border-box}
html{background:#9fbfba}
body{
  margin:0;color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(var(--sky) 0 32%,var(--grass2) 32% 100%);
}
button,input{font:inherit}
.app{
  max-width:430px;min-height:100vh;margin:auto;position:relative;overflow:hidden;
  padding-bottom:88px;
  background:
    linear-gradient(var(--sky2) 0 27%,#d7e9c4 27% 27.5%,var(--grass2) 27.5% 100%);
}
.app:before{
  content:"";position:absolute;inset:0 0 auto;height:170px;pointer-events:none;
  background:
    radial-gradient(ellipse 48px 20px at 18% 24%,rgba(255,255,255,.68) 0 55%,transparent 56%),
    radial-gradient(ellipse 38px 16px at 79% 14%,rgba(255,255,255,.55) 0 55%,transparent 56%),
    radial-gradient(circle at 9% 68%,rgba(255,255,255,.25) 0 2px,transparent 3px),
    radial-gradient(circle at 91% 47%,rgba(255,255,255,.3) 0 2px,transparent 3px);
}
.top{
  padding:17px 16px 8px;display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:2;
}
.logo{
  font:13px/1.45 "Press Start 2P",monospace;color:var(--green-dark);
  text-shadow:2px 2px #fff8dc;letter-spacing:-1px;
}
.small{font-size:11px;color:var(--muted)}
.card{
  margin:11px 13px;background:var(--paper);border:3px solid #717c62;border-radius:8px;
  box-shadow:4px 5px 0 var(--shadow);padding:15px;position:relative;
}
.card:after{
  content:"";position:absolute;inset:4px;border:1px solid rgba(135,112,81,.18);
  border-radius:5px;pointer-events:none;
}
.hero{
  min-height:255px;overflow:hidden;
  background:linear-gradient(#d7eee9 0 50%,#a9cf88 50% 100%);
}
.hero:before{
  content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:90px;
  background:
    repeating-linear-gradient(90deg,rgba(67,111,57,.10) 0 4px,transparent 4px 12px);
  transform:skewY(-2deg);
}
h1{
  font:14px/1.8 "Press Start 2P",monospace;color:#526e4b;
  text-shadow:2px 2px #fff6dc;margin:8px 0;position:relative;
}
h2{
  font:10px/1.8 "Press Start 2P",monospace;color:#69875b;margin:0 0 12px;
}
p{font-size:13px;line-height:1.65}
.world{font:22px "VT323",monospace;color:#668c5b;letter-spacing:1px;position:relative}
.badge{
  display:inline-block;padding:5px 8px;border:2px solid #70775e;border-radius:5px;
  background:var(--yellow);color:#5c4d31;box-shadow:2px 3px 0 #b59b72;
  font:18px "VT323",monospace;
}
.progress{height:14px;background:#e8dfca;border:2px solid #70775e;border-radius:8px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#79a66b,#a9c982)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{
  width:100%;padding:12px 10px;border:3px solid #68745e;border-radius:6px;
  background:var(--green);color:#fffced;box-shadow:3px 4px 0 #817159;
  font:9px/1.7 "Press Start 2P",monospace;font-weight:900;cursor:pointer;
}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px #817159}
.btn.secondary{background:#f5e8ca;color:#685947}

.field{margin:13px 0}
.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px;color:#625b52}
.field input{
  width:100%;padding:11px;border:2px solid #a0a18d;border-radius:5px;
  background:#fffef8;color:#403b36;outline:0;font-weight:800;
}

.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.choice{
  padding:11px 7px;text-align:center;border:2px solid #8f987f;border-radius:6px;
  background:#f8f2df;box-shadow:2px 3px 0 #c9bca4;cursor:pointer;
}
.choice.selected{background:#dcebc9;border-color:#6d965d;color:#527048}
.choice strong{display:block;font:9px/1.7 "Press Start 2P",monospace}
.choice small{display:block;margin-top:6px;font-size:10px;color:var(--muted)}

.quest{
  display:flex;align-items:center;gap:10px;padding:13px 0;
  border-top:2px dashed var(--line);
}
.quest:first-of-type{border-top:0}
.check{
  flex:0 0 32px;width:32px;height:32px;border:2px solid #77836c;
  border-radius:5px;background:#f4efde;display:grid;place-items:center;
  cursor:pointer;font:15px "Press Start 2P",monospace;color:white;
}
.check.done{background:#80ab70}
.quest b{font-size:13px}
.quest span{display:block;margin-top:4px;font-size:11px;line-height:1.5;color:var(--muted)}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.statbox{
  padding:11px;background:#f5f0de;border:2px solid #969a82;border-radius:6px;
  box-shadow:2px 3px 0 #c9bca4;
}
.statbox strong{display:block;font:27px "VT323";color:#71965e}

.nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(430px,100%);padding:7px 8px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;background:#fff9ea;border-top:3px solid #788069;
  box-shadow:0 -4px rgba(113,98,76,.15);z-index:20;
}
.nav button{
  padding:8px 3px;border:2px solid #a3a68e;border-radius:5px;background:#f4ecd8;
  color:#817d72;font:8px/1.6 "Press Start 2P",monospace;
}
.nav button.active{background:#dfebcd;color:#648057;box-shadow:inset 0 -2px #a8b695}

.modal-back{
  position:fixed;inset:0;background:rgba(65,77,61,.40);display:none;
  align-items:flex-end;justify-content:center;z-index:60;
}
.modal-back.show{display:flex}
.modal{
  width:min(430px,100%);max-height:88vh;overflow:auto;background:#fffaf0;
  border:3px solid #68735b;border-radius:10px;padding:18px;
  box-shadow:6px 0 #9f8d70,-6px 0 #9f8d70;
}
.modal h1{font-size:12px}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  z-index:70;display:none;padding:9px 12px;border:2px solid #786a4e;border-radius:5px;
  background:#f5d77d;color:#584927;font-size:12px;font-weight:900;box-shadow:3px 3px #a38f6b;
}
.toast.show{display:block}

/* small pixel-art character */
.sprite{width:88px;height:108px;margin:0 auto;position:relative;transform:scale(.82);filter:drop-shadow(3px 4px 0 rgba(79,69,55,.25))}
.sprite .hair{position:absolute;left:23px;top:6px;width:48px;height:25px;background:#765359;border:3px solid #5c4b49}
.sprite .head{position:absolute;left:27px;top:14px;width:40px;height:39px;background:#ffd4b0;border:3px solid #5c4b49;box-shadow:inset 0 -5px #efb28f}
.sprite .eye1,.sprite .eye2{position:absolute;top:30px;width:5px;height:5px;background:#4b3b3b}
.sprite .eye1{left:37px}.sprite .eye2{left:53px}
.sprite .body{position:absolute;left:19px;top:52px;width:57px;height:40px;background:#9dbd7b;border:3px solid #5c4b49}
.sprite .leg1,.sprite .leg2{position:absolute;top:89px;width:17px;height:12px;background:#8fb6c5;border:3px solid #5c4b49}
.sprite .leg1{left:27px}.sprite .leg2{left:53px}

/* tiny pixel landscape */
.land{
  height:76px;margin:-11px -15px 11px;background:#a9cf89;
  border-top:3px solid #717c62;border-bottom:3px solid #717c62;position:relative;overflow:hidden;
}
.land:before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 22%,#dcebc7 0 5px,transparent 6px),
    radial-gradient(circle at 48% 60%,#739b60 0 3px,transparent 4px),
    radial-gradient(circle at 77% 31%,#dcebc7 0 4px,transparent 5px),
    repeating-linear-gradient(90deg,rgba(72,113,62,.09) 0 4px,transparent 4px 12px);
}
.tree{position:absolute;bottom:8px;width:21px;height:37px;background:#668e58;border:3px solid #58624e;box-shadow:0 -10px 0 #789f64,0 -20px 0 #668e58}
.tree.a{left:22px}.tree.b{right:26px}
.path{position:absolute;left:-2%;right:-2%;bottom:-13px;height:38px;background:#d4b17d;transform:skewY(-5deg);border-top:3px solid #9b815f}

@media(max-width:360px){.card{margin-left:10px;margin-right:10px}.hero h1{font-size:12px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="dietdiedieV1";
const todayKey=()=>new Date().toISOString().slice(0,10);

const defaultState={
  started:false,name:"ryurya",level:1,xp:0,streak:0,bestStreak:0,stageNo:1,
  lastDate:null,morning:null,quests:[],cleared:false,history:[],weight:null,goalWeight:null
};
let S=load();

function load(){
  try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY))}}
  catch(e){return {...defaultState}}
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;x.classList.add("show");
  setTimeout(()=>x.classList.remove("show"),1800);
}
function xpNeed(){return 200+(S.level-1)*60}
function addXP(n){
  S.xp+=n;
  while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;toast("LEVEL UP! Lv."+S.level)}
}
function openModal(html){
  document.getElementById("modal").innerHTML=html;
  document.getElementById("modalBack").classList.add("show");
}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});

const intensity={
  light:{label:"🌿 가볍게",mult:.75,desc:"부담 없이"},
  normal:{label:"🌱 적당히",mult:1,desc:"딱 적당하게"},
  hard:{label:"🔥 제대로",mult:1.2,desc:"운동 제대로"},
  veryhard:{label:"⚡ 도전",mult:1.35,desc:"오늘은 빡세게"}
};
const condition={
  great:{label:"😄 최고",desc:"컨디션 좋아"},
  normal:{label:"🙂 보통",desc:"평소 같아"},
  tired:{label:"😴 피곤",desc:"좀 지쳤어"},
  sore:{label:"🫠 뻐근",desc:"몸이 뻐근해"}
};

function makeStage(){
  const m=S.morning||{intensity:"normal",condition:"normal"};
  let mult=intensity[m.intensity].mult;
  if(m.condition==="tired")mult*=.85;
  if(m.condition==="sore")mult*=.78;

  if(S.history.length){
    const last=S.history[S.history.length-1];
    if(last.effort==="too_hard")mult*=.88;
    if(last.effort==="too_easy")mult*=1.08;
  }

  mult=Math.max(.65,Math.min(1.35,mult));
  const mins=Math.round((16*mult)/2)*2;
  const water=mult<.8?1.3:mult>1.15?1.8:1.5;
  const steps=mins>=18?7000:5500;

  let workout;
  if(m.condition==="sore"){
    workout={title:"🧘 "+mins+"분 회복 루틴",items:["캣카우 8회","글루트 브릿지 12회 × 2","버드독 8회 × 2","전신 스트레칭 5분"]};
  }else if(S.stageNo%3===1){
    workout={title:"🏠 "+mins+"분 전신 루틴",items:["스쿼트 12회 × 3","글루트 브릿지 15회 × 3","벽 푸시업 10회 × 2","데드버그 8회 × 2","가벼운 스트레칭 3분"]};
  }else if(S.stageNo%3===2){
    workout={title:"🍑 "+mins+"분 하체·코어",items:["스쿼트 12회 × 3","사이드 레그레이즈 12회 × 2","글루트 브릿지 15회 × 3","데드버그 8회 × 2","힙 스트레칭 3분"]};
  }else{
    workout={title:"💪 "+mins+"분 상체·코어",items:["벽/무릎 푸시업 10회 × 3","버드독 8회 × 2","데드버그 8회 × 2","플랭크 15~25초 × 3","어깨 스트레칭 3분"]};
  }

  return [
    {id:"move",title:workout.title,detail:workout.items.join(" · "),xp:45},
    {id:"food",title:"🥗 단백질 챙기기",detail:"오늘 2끼에 단백질 식품 포함하기",xp:30},
    {id:"water",title:"💧 물 "+water+"L 마시기",detail:"한 번에 몰아 마시지 말고 나눠 마시기",xp:25},
    {id:"walk",title:"🚶 "+steps.toLocaleString()+"보 걷기",detail:"평소 활동량을 조금만 늘리기",xp:30}
  ];
}

function ensureToday(){
  const d=todayKey();
  if(!S.lastDate){
    S.lastDate=d;S.quests=makeStage();S.cleared=false;save();
  }else if(S.lastDate!==d){
    S.stageNo++;S.lastDate=d;S.morning=null;S.quests=[];S.cleared=false;save();
  }
}

function render(){
  if(!S.started){renderStart();return}
  ensureToday();renderHome();
}

function renderStart(){
  document.getElementById("app").innerHTML=`
  <div class="top">
    <div class="logo">DIETDIEDIE</div><div class="badge">NEW GAME</div>
  </div>
  <div class="card hero">
    <div class="world" style="text-align:center">★ RYURYA'S LITTLE WORLD ★</div>
    <div class="sprite">
      <div class="hair"></div><div class="head"></div><div class="eye1"></div><div class="eye2"></div>
      <div class="body"></div><div class="leg1"></div><div class="leg2"></div>
    </div>
    <h1>오늘도 한 스테이지,<br>가볍게 깨보자!</h1>
    <p>하루에 딱 하나의 스테이지.<br>오늘 뭐 할지는 내가 정해줄게.</p>
  </div>
  <div class="card">
    <h2>FIRST SETUP</h2>
    <div class="field"><label>이름</label><input id="name" value="ryurya"></div>
    <div class="field"><label>현재 체중 · 선택</label><input id="weight" type="number" step="0.1" placeholder="예: 50"></div>
    <div class="field"><label>목표 체중 · 선택</label><input id="goal" type="number" step="0.1" placeholder="예: 48"></div>
    <button class="btn" onclick="startGame()">START QUEST ▶</button>
  </div>`;
}

function startGame(){
  S.name=document.getElementById("name").value||"ryurya";
  S.weight=parseFloat(document.getElementById("weight").value)||null;
  S.goalWeight=parseFloat(document.getElementById("goal").value)||null;
  S.started=true;S.lastDate=todayKey();S.stageNo=1;save();showMorning(true);
}

function showMorning(first=false){
  const m=S.morning||{};
  openModal(`
    <h1>${first?"FIRST STAGE":"TODAY STATUS"}</h1>
    <p>오늘 원하는 강도와 몸 상태를 골라줘.<br>그걸 반영해서 오늘 스테이지를 만들게.</p>
    <div class="field">
      <label>TODAY'S INTENSITY</label>
      <div class="choice-grid">
        ${Object.entries(intensity).map(([k,v])=>`
          <div class="choice ${m.intensity===k?"selected":""}" onclick="pick('intensity','${k}')">
            <strong>${v.label}</strong><small>${v.desc}</small>
          </div>`).join("")}
      </div>
    </div>
    <div class="field">
      <label>TODAY'S CONDITION</label>
      <div class="choice-grid">
        ${Object.entries(condition).map(([k,v])=>`
          <div class="choice ${m.condition===k?"selected":""}" onclick="pick('condition','${k}')">
            <strong>${v.label}</strong><small>${v.desc}</small>
          </div>`).join("")}
      </div>
    </div>
    <button class="btn" onclick="saveMorning()">BUILD TODAY'S STAGE ▶</button>
  `);
  window.tempM={...m};
}

function pick(type,k){
  window.tempM=window.tempM||{};
  window.tempM[type]=k;
  showMorning(false);
}
function saveMorning(){
  if(!window.tempM?.intensity||!window.tempM?.condition){
    toast("강도와 컨디션을 골라줘!");return;
  }
  S.morning=window.tempM;S.quests=makeStage();S.cleared=false;save();
  closeModal();renderHome();
}

function renderHome(){
  const done=S.quests.filter(q=>q.done).length,total=S.quests.length;
  const pct=total?Math.round(done/total*100):0;

  document.getElementById("app").innerHTML=`
  <div class="top">
    <div class="logo">DIETDIEDIE</div><div class="small">STREAK ${S.streak}</div>
  </div>

  <div class="card hero">
    <div class="land"><div class="tree a"></div><div class="tree b"></div><div class="path"></div></div>
    <div class="row">
      <div>
        <span class="badge">DAY ${String(S.stageNo).padStart(2,"0")}</span>
        <h1>TODAY'S STAGE</h1>
      </div>
      <div style="font-size:43px">🌱</div>
    </div>
    <p>${S.cleared?"🎉 TODAY'S STAGE CLEAR!":"오늘의 퀘스트를 3개 이상 깨면 클리어!"}</p>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="small">${done}/${total} QUESTS · LV.${S.level} · ${S.xp}/${xpNeed()} XP</div>
  </div>

  <div class="card">
    <h2>STAGE MAP</h2>
    <div style="display:flex;align-items:center;gap:5px;overflow:hidden">
      <span class="badge">01 ✓</span><span>—</span>
      <span class="badge" style="background:#f8dfa4">02 ★</span><span>—</span>
      <span class="badge" style="opacity:.45">03 🔒</span><span>—</span>
      <span class="badge" style="opacity:.45">04 🔒</span>
    </div>
  </div>

  <div class="card">
    <h2>TODAY'S QUEST</h2>
    ${S.quests.map((q,i)=>`
      <div class="quest">
        <button class="check ${q.done?"done":""}" onclick="toggleQuest(${i})">${q.done?"✓":""}</button>
        <div style="flex:1"><b>${q.title}</b><span>${q.detail}</span></div>
        <b style="color:#71965e">+${q.xp}</b>
      </div>`).join("")}
    <div style="margin-top:14px">
      <button class="btn ${done>=3?"":"secondary"}" onclick="finishStage()">
        ${done>=3?"STAGE CLEAR":"CLEAR MORE QUESTS"}
      </button>
    </div>
  </div>

  <div class="card">
    <h2>PLAYER LOG</h2>
    <div class="stat">
      <div class="statbox"><span class="small">CURRENT LEVEL</span><strong>Lv.${S.level}</strong></div>
      <div class="statbox"><span class="small">BEST STREAK</span><strong>${S.bestStreak}일</strong></div>
    </div>
    <button class="btn secondary" style="margin-top:10px" onclick="showMorning(false)">오늘 강도 다시 설정</button>
  </div>

  ${nav("home")}`;
}

function nav(active){
  return `<div class="nav">
    <button class="${active==="home"?"active":""}" onclick="renderHome()">HOME</button>
    <button class="${active==="log"?"active":""}" onclick="showStats()">LOG</button>
    <button class="${active==="me"?"active":""}" onclick="showAbout()">RYURYA</button>
  </div>`;
}

function toggleQuest(i){
  if(S.quests[i].done)return;
  S.quests[i].done=true;addXP(S.quests[i].xp);save();renderHome();toast("QUEST CLEAR!");
}

function finishStage(){
  if(S.quests.filter(q=>q.done).length<3){
    toast("3개 이상 완료하면 CLEAR야!");return;
  }
  if(!S.cleared){
    S.cleared=true;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    S.history.push({date:S.lastDate,effort:null,cleared:true});
    addXP(50);save();
  }
  showNight();
}

function showNight(){
  openModal(`
    <h1>DAY ${String(S.stageNo).padStart(2,"0")} COMPLETE!</h1>
    <p>오늘 스테이지 난이도는 어땠어?<br>다음 스테이지에 바로 반영할게.</p>
    <div class="choice-grid" style="margin:14px 0">
      <div class="choice" onclick="nightPick('too_easy')"><strong>😴 너무 쉬웠어</strong><small>조금 더 해도 돼</small></div>
      <div class="choice" onclick="nightPick('just_right')"><strong>🙂 딱 좋았어</strong><small>이 정도가 좋아</small></div>
      <div class="choice" onclick="nightPick('a_bit_hard')"><strong>😮‍💨 조금 힘들었어</strong><small>살짝 낮춰줘</small></div>
      <div class="choice" onclick="nightPick('too_hard')"><strong>🫠 너무 힘들었어</strong><small>내일은 쉬어가자</small></div>
    </div>
    <button class="btn secondary" onclick="closeModal()">나중에 답하기</button>
  `);
}

function nightPick(e){
  const h=S.history[S.history.length-1];
  if(h)h.effort=e;
  save();closeModal();toast("다음 스테이지에 반영했어!");renderHome();
}

function showStats(){
  const cleared=S.history.filter(x=>x.cleared).length;
  document.getElementById("app").innerHTML=`
    <div class="top"><div class="logo">DIETDIEDIE</div></div>
    <div class="card"><h2>MY JOURNEY</h2>
      <div class="stat">
        <div class="statbox"><span class="small">CLEAR</span><strong>${cleared}일</strong></div>
        <div class="statbox"><span class="small">STREAK</span><strong>${S.streak}일</strong></div>
        <div class="statbox"><span class="small">LEVEL</span><strong>${S.level}</strong></div>
        <div class="statbox"><span class="small">XP</span><strong>${S.xp}</strong></div>
      </div>
    </div>
    <div class="card"><h2>BODY</h2>
      <p>현재 체중: <b>${S.weight?S.weight+" kg":"아직 기록 없음"}</b></p>
      <p>목표 체중: <b>${S.goalWeight?S.goalWeight+" kg":"아직 설정 없음"}</b></p>
      <button class="btn secondary" onclick="editWeight()">체중 기록</button>
    </div>
    ${nav("log")}`;
}

function editWeight(){
  openModal(`
    <h1>TODAY'S WEIGHT</h1>
    <div class="field"><label>현재 체중</label><input id="w" type="number" step="0.1" value="${S.weight||""}"></div>
    <button class="btn" onclick="S.weight=parseFloat(document.getElementById('w').value)||S.weight;save();closeModal();showStats()">SAVE</button>
  `);
}

function showAbout(){
  document.getElementById("app").innerHTML=`
    <div class="top"><div class="logo">DIETDIEDIE</div></div>
    <div class="card hero">
      <div class="sprite">
        <div class="hair"></div><div class="head"></div><div class="eye1"></div><div class="eye2"></div>
        <div class="body"></div><div class="leg1"></div><div class="leg2"></div>
      </div>
      <h1>ryurya · Lv.${S.level}</h1>
      <p>작은 습관을 깨면서<br>캐릭터도 같이 자라는 중.</p>
      <div class="progress"><i style="width:${Math.round(S.xp/xpNeed()*100)}%"></i></div>
      <div class="small">${S.xp}/${xpNeed()} XP TO NEXT LEVEL</div>
    </div>
    <div class="card">
      <h2>INVENTORY</h2>
      <p>🌱 아직 잠금 해제된 아이템이 없어.</p>
      <p class="small">나중에 옷, 방 꾸미기, 수집 아이템을 붙일 수 있어.</p>
    </div>
    ${nav("me")}`;
}

render();
</script>
</body>
</html>
